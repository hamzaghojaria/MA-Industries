<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M&amp;A Industries | Product Collection</title>
<style>
:root{--ink:#24382e;--green:#245c3a;--muted:#647269;--line:#dce3d8;--cream:#f5f4ee}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.6 Arial,sans-serif}header{max-width:1440px;margin:auto;padding:24px 4vw;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:700;letter-spacing:-.5px}.brand span{color:var(--green)}header p{margin:0;color:var(--muted);font-size:10px;letter-spacing:2px}.slide{display:none;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);gap:48px;max-width:1440px;margin:auto;padding:44px 4vw 56px;min-height:calc(100svh - 174px);align-items:start}.slide.active{display:grid}.visual{position:sticky;top:32px;min-width:0}.folio{display:block;font-size:11px;letter-spacing:2px;margin-bottom:24px;color:var(--green)}figure{margin:0;background:white;border:1px solid var(--line);border-radius:12px;padding:24px}figure img{display:block;width:100%;height:clamp(260px,43vh,520px);object-fit:contain}figcaption{text-align:center;font-size:10px;color:var(--muted);margin-top:18px}.copy{min-width:0}.eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin:0 0 16px}h1{font-size:clamp(28px,3vw,46px);letter-spacing:-1.4px;line-height:1.15;margin:0 0 18px}.description{font-size:15px;line-height:1.8;color:var(--muted);margin:0 0 25px}.material{display:grid;grid-template-columns:78px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line)}h2{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--green);margin:3px 0}.material p{margin:0;font-size:12px;color:var(--muted)}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-top:14px;background:white}table{border-collapse:collapse;width:100%;font-size:12px;text-align:left}caption{text-align:left;padding:14px 16px;font-weight:700;font-size:12px}thead{background:var(--green);color:white;font-size:10px;letter-spacing:.5px}th,td{padding:12px;vertical-align:top;border-bottom:1px solid var(--line)}tbody th{width:31%;font-weight:600}tbody tr:nth-child(even){background:#f4f6f1}tbody tr:last-child>*{border-bottom:0}td:last-child{white-space:nowrap}.technical-note{font-size:11px;color:var(--muted);padding-left:12px;border-left:2px solid var(--green);margin-top:18px}.spec-list{margin:14px 0;background:white;border:1px solid var(--line);border-radius:8px}.spec-list>div{display:grid;grid-template-columns:140px 1fr;gap:18px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:12px}.spec-list>div:last-child{border-bottom:0}dt{font-weight:700}dd{margin:0;color:var(--muted)}.availability,.uses{font-size:12px;color:var(--muted);margin-top:22px}.uses b{display:block;color:var(--green);text-transform:uppercase;font-size:10px;letter-spacing:1.3px;margin-bottom:6px}.cta{display:flex;justify-content:space-between;align-items:center;gap:20px;background:var(--green);color:white;text-decoration:none;padding:16px 20px;margin-top:28px;font-size:12px;border-radius:4px}.cta:hover{background:#173d2a}small{display:block;font-size:10px;color:var(--muted);margin-top:12px}footer{position:sticky;bottom:0;background:#f5f4eef5;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:14px;padding:16px 4vw;z-index:2}button,select{font:12px Arial;padding:12px;border:1px solid #b9c5b8;border-radius:4px;background:white;color:var(--ink);min-height:44px}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}select{width:340px;max-width:50vw}#count{font-size:11px;white-space:nowrap;color:var(--muted)}#progress{height:3px;background:var(--green);position:fixed;bottom:0;left:0;z-index:3}a:focus-visible,button:focus-visible,select:focus-visible,.table-wrap:focus-visible{outline:3px solid #8fae88;outline-offset:3px}@media(max-width:800px){header{padding:20px}.brand{font-size:17px}header p{font-size:8px;max-width:140px;text-align:right}.slide.active{grid-template-columns:1fr;gap:24px;padding:24px 20px 32px}.visual{position:static}.folio{margin-bottom:14px}figure{padding:16px}figure img{height:250px}.copy h1{font-size:32px}.table-wrap table{min-width:370px}.spec-list>div{grid-template-columns:110px 1fr;gap:12px}footer{flex-wrap:wrap;gap:8px;padding:12px 16px}select{order:-1;max-width:100%;width:100%}#count{margin-left:auto}th,td{padding:10px}}@media print{header,footer,#progress{display:none}.slide,.slide.active{display:grid;break-after:page;min-height:95vh}.visual{position:static}.cta{background:white;color:var(--green);border:1px solid var(--line)}}
</style>
</head><body>
<header><div class="brand"><span>M&amp;A</span> INDUSTRIES</div><p>THE PRODUCT COLLECTION</p></header>
<main>SLIDES</main>
<footer><button id="prev" aria-label="Previous product">&#8592; Previous</button><select id="jump" aria-label="Choose product">OPTIONS</select><button id="next" aria-label="Next product">Next &#8594;</button><span id="count" aria-live="polite"></span></footer><div id="progress" aria-hidden="true"></div>
<script>
const slides=[...document.querySelectorAll('.slide')],jump=document.querySelector('#jump'),prev=document.querySelector('#prev'),next=document.querySelector('#next');
let index=0;
function show(n){index=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>{s.classList.toggle('active',i===index);s.setAttribute('aria-hidden',i!==index);s.inert=i!==index});jump.value=index;prev.disabled=index===0;next.disabled=index===slides.length-1;document.querySelector('#count').textContent=String(index+1).padStart(2,'0')+' / '+slides.length;document.querySelector('#progress').style.width=((index+1)/slides.length*100)+'%'}
prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);jump.onchange=()=>show(Number(jump.value));document.addEventListener('keydown',e=>{if(/SELECT|INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();show(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(index-1)}});show(0);
</script>
</body></html>
