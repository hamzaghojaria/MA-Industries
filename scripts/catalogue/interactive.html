<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M&A Industries | Sugarcane & Recycled</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf9f4;color:#203d35;font-family:Arial,sans-serif}header{height:88px;padding:24px 4vw;border-bottom:1px solid #ccd4c9;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:bold;font-size:20px}.brand span{color:#a70027}header p{font-size:10px;letter-spacing:2px}main{min-height:calc(100svh - 170px)}.slide{display:none;grid-template-columns:1.12fr 1fr;min-height:calc(100svh - 170px)}.slide.active{display:grid}.visual{position:relative;background:#edf0e7;display:flex;align-items:center;justify-content:center;padding:65px}.visual img{width:100%;height:55vh;object-fit:contain;mix-blend-mode:multiply;animation:arrive .8s ease both}.folio{position:absolute;top:30px;left:4vw;font-size:12px;letter-spacing:3px}.copy{padding:5vh 5vw;align-self:center;animation:reveal .6s ease both}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#58705d}h1{font:clamp(32px,3.4vw,60px)/1.05 Georgia,serif;margin:24px 0}.description{font-size:16px;line-height:1.65;color:#5b685f}.spec{border-top:1px solid #ccd4c9;margin-top:25px;padding-top:20px}.spec b{font-size:9px;letter-spacing:2px}.spec ul{padding-left:18px;font-size:12px;line-height:1.7;color:#65716a}.spec p{font-size:12px;line-height:1.6;color:#65716a}.cta{display:flex;justify-content:space-between;background:#203d35;color:white;text-decoration:none;padding:19px 23px;margin-top:25px;font-size:12px;transition:background .2s,transform .2s}.cta:hover{background:#345c49;transform:translateY(-3px)}small{display:block;font-size:9px;color:#65716a;margin-top:15px}footer{display:flex;align-items:center;gap:14px;min-height:82px;padding:16px 4vw;border-top:1px solid #ccd4c9}button,select{font:12px Arial;padding:12px;border:1px solid #b9c5b8;background:transparent;color:#203d35;cursor:pointer}button:disabled{opacity:.3;cursor:default}select{max-width:45vw}#progress{height:3px;background:#a70027;position:fixed;bottom:0;left:0;transition:width .5s}#count{margin-left:auto;font-size:11px;white-space:nowrap}@keyframes arrive{from{opacity:0;transform:scale(.95) translateY(20px)}to{opacity:1;transform:none}}@keyframes reveal{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:750px){header{height:auto}.brand{font-size:16px}header p{max-width:130px;line-height:1.5}.slide.active{grid-template-columns:1fr}.visual{padding:50px 25px 25px}.visual img{height:32vh}.copy{padding:25px}.folio{top:20px}.copy h1{margin:16px 0}footer{flex-wrap:wrap;gap:8px}select{max-width:100%;flex:1}#count{display:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media print{header,footer,#progress{display:none}.slide,.slide.active{display:grid;break-after:page;min-height:95vh}.copy,.visual img{animation:none}.cta{color:#203d35;background:white}}
</style><header><div class="brand"><span>M&A</span> INDUSTRIES</div><p>SUGARCANE & RECYCLED<br>THE CONSIDERED COLLECTION</p></header><main>SLIDES</main><footer><button id="prev" aria-label="Previous product">← Previous</button><select id="jump" aria-label="Choose product">OPTIONS</select><button id="next" aria-label="Next product">Next →</button><span id="count"></span></footer><div id="progress"></div><script>
const slides=[...document.querySelectorAll('.slide')],jump=document.querySelector('#jump'),prev=document.querySelector('#prev'),next=document.querySelector('#next');let index=0;function show(n){index=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>{s.classList.toggle('active',i===index);s.setAttribute('aria-hidden',i!==index)});jump.value=index;prev.disabled=index===0;next.disabled=index===slides.length-1;document.querySelector('#count').textContent=String(index+1).padStart(2,'0')+' / '+slides.length;document.querySelector('#progress').style.width=((index+1)/slides.length*100)+'%'}prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);jump.onchange=()=>show(Number(jump.value));document.addEventListener('keydown',e=>{if(/SELECT|INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1)});show(0);
</script></html>
