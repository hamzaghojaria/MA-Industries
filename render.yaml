services:
  - type: web
    name: ma-industries
    runtime: static
    buildCommand: node scripts/site/build.mjs
    staticPublishPath: ./dist
    envVars:
      - key: SITE_URL
        value: https://maindustries.in
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/catalogues/MA-Industries-Catalogue.pdf
        name: Content-Disposition
        value: 'attachment; filename="MA-Industries-Catalogue.pdf"'
    routes:
